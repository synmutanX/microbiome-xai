[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbxai"
version = "0.1.0"
description = "Explainable, cross-cohort validated gut microbiome biomarkers (SHAP, leakage-free CV, confounder checks)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sofyan" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.8",
    "shap>=0.46",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mbxai = "mbxai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mbxai"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::FutureWarning"]
